name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run: no point burning
# minutes on a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        working-directory: backend
        run: mvn -B clean compile

      - name: Unit tests
        working-directory: backend
        run: mvn -B surefire:test

      # Integration tests use Testcontainers, which needs a Docker daemon.
      # The ubuntu runner provides one, so no service container is declared.
      - name: Integration tests
        working-directory: backend
        run: mvn -B verify

      - name: Package
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Only worth running once the pieces are known to build.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start PostgreSQL
        run: |
          docker run -d --name spendscope-e2e-db \
            -e POSTGRES_DB=spendscope \
            -e POSTGRES_USER=spendscope \
            -e POSTGRES_PASSWORD=spendscope \
            -p 5432:5432 postgres:17-alpine
          for _ in $(seq 1 30); do
            docker exec spendscope-e2e-db pg_isready -U spendscope && break
            sleep 2
          done

      - name: Build backend
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: Start backend
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: local
          DATABASE_URL: jdbc:postgresql://localhost:5432/spendscope
          DATABASE_USERNAME: spendscope
          DATABASE_PASSWORD: spendscope
        run: |
          java -jar target/*.jar > backend.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health && break
            sleep 2
          done

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Backend log on failure
        if: failure()
        working-directory: backend
        run: tail -200 backend.log

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Verifies the images actually build. Not pushed: this workflow has
      # read-only permissions and no registry credentials.
      - name: Build backend image
        run: docker build -t spendscope-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t spendscope-frontend:ci ./frontend

      - name: Verify compose file is valid
        run: docker compose config --quiet

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}

      - name: Build Java
        if: matrix.language == 'java-kotlin'
        working-directory: backend
        run: mvn -B clean compile -DskipTests

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
