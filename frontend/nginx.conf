server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never advertise the exact server version.
    server_tokens off;

    # Client-side routing: any unknown path is handed to index.html so that a
    # deep link like /transactions works on a hard refresh instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the API to the backend so the browser sees one origin. Same-origin
    # means no CORS preflights and no third-party cookie handling for the
    # session cookie.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CSV imports can take a while; the default 60s is tight for a large file.
        proxy_read_timeout 120s;
        client_max_body_size 6m;
    }

    # Hashed asset filenames are content-addressed, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or users keep loading an old bundle that
    # points at deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
