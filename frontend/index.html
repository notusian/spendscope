<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SpendScope - import, categorise and analyse your personal spending." />
    <meta name="color-scheme" content="light dark" />
    <title>SpendScope</title>
    <script>
      // Apply the saved theme before the first paint.
      try {
        const preference = localStorage.getItem('spendscope-theme');
        document.documentElement.dataset.theme = preference === 'light' || preference === 'dark'
          ? preference
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
